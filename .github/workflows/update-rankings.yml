name: MMA Daily Rankings Update

on:
  workflow_dispatch:
    inputs:
      horizon_days:
        description: 'How far into the future to scan for scheduled fights. Default 180; set high (e.g. 36500) to capture ALL future events.'
        required: false
        default: '180'
        type: string

concurrency:
  group: rank-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run update-rankings

      - run: npm run update-news
        continue-on-error: true
        env:
          FIGHTER_LIMIT: ''
          HORIZON_DAYS: ${{ inputs.horizon_days || '180' }}

      - name: Notify scheduled fights and rankings
        run: npm run notify
        continue-on-error: true
        env:
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_PASS: ${{ secrets.NOTIFY_EMAIL_PASS }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}

      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/rankings.json public/data/boxing-records.json public/data/upcoming-fights.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m 'chore: update mma rankings and fight news [skip ci]'
            git push
          fi

      - name: Build and Deploy to Vercel
        run: npx vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
