name: MMA Daily Rankings Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      fighter_limit:
        description: 'Only query news for top N fighters (0 or blank = all)'
        type: number
        required: false
        default: 0

concurrency:
  group: rank-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run update-rankings
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - run: npm run update-news
        continue-on-error: true
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FIGHTER_LIMIT: ${{ inputs.fighter_limit || '' }}

      - name: Notify new fight news
        run: npm run notify
        continue-on-error: true
        env:
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_PASS: ${{ secrets.NOTIFY_EMAIL_PASS }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}

      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/rankings.json public/data/upcoming-fights.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m 'chore: update mma rankings and fight news [skip ci]'
            git push
          fi

      - name: Build and Deploy to Vercel
        run: npx vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
